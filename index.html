<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZapCharge: carregadores de parede e portáteis para carros elétricos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('zc-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>ZapCharge®</title>

    <script type="module" src="/src/main.jsx"></script>
